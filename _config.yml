# Site configuration. Jekyll does not reload this file while `jekyll serve`
# is running; restart the server after changing it.

# Site Settings
locale                   : "en-US"
title                    : "Qixiang Chen"
title_separator          : "-"
name                     : "Qixiang Chen"
description              : "PhD Student at Monash University."
url                      : https://q1xiangchen.github.io
baseurl                  : ""
repository               : "q1xiangchen/q1xiangchen.github.io"


# Site Author (shown in the left sidebar; empty fields are hidden)
author:
  name             : "Qixiang Chen"
  avatar           : "profile.jpg"
  bio              : "PhD Student at Monash University."
  location         : "Melbourne, Australia"
  email            : "qixiangchen03@outlook.com"
  github           : "q1xiangchen"
  googlescholar    : "https://scholar.google.com/citations?user=qdEDSIMAAAAJ&hl=en"
  linkedin         :


# Reading Files
include:
  - _pages
  - files
exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - node_modules
  - package.json
  - vendor
keep_files:
  - .git
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"


# Conversion
markdown: kramdown
highlighter: rouge
excerpt_separator: "\n\n"


# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  entity_output: as_char
  smart_quotes: lsquo,rsquo,ldquo,rdquo


# Defaults
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true


# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed


# Outputting
timezone: Australia/Melbourne


# Plugins
plugins:
  - jekyll-sitemap
  - jekyll-redirect-from


# HTML Compression
# - http://jch.penibelst.de/
compress_html:
  clippings: all
  ignore:
    envs: development
